        .back-to-top {

            border-radius:50%; background-color:var(--bg-card); border:1px solid var(--border);
            box-shadow:var(--shadow); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            color:var(--text-secondary); opacity:0; pointer-events:none;
            transition:opacity 0.3s, transform 0.2s; z-index:1000;
        }
        .back-to-top.visible { opacity:1; pointer-events:auto; }
        .back-to-top:hover { transform:translateY(-2px); color:var(--accent); }

        .toast {
            position:fixed; bottom:40px; left:50%;
            transform:translateX(-50%) translateY(100px);
            background:#1d1d1f; color:#fff; padding:12px 24px;
            border-radius:980px; font-size:15px; z-index:4000;

        }
        .toast.show { transform:translateX(-50%) translateY(0); }
        @media (prefers-color-scheme:dark) { .toast { background:#f5f5f7; color:#1d1d1f; } }

        @media (max-width:768px) {
            .header h1 { font-size:28px; letter-spacing:1px; }
            .header .manifesto { font-size:15px; line-height:1.9; }
            .poster-list { gap:36px; }
            .poster-item { gap:12px; }
            .action-bar { margin-top:40px; }
            .generator-section { padding:24px 16px; }
            .back-to-top { bottom:20px; right:16px; width:40px; height:40px; }
            .btn { padding:10px 20px; font-size:15px; }
            .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>

    <script>
    (function() {

    var posters = [
        { name: '史蒂夫·乔布斯', file: '史蒂夫·乔布斯_励志海报.jpg', download: '史蒂夫·乔布斯说你一定行.jpg' },
        { name: '段永平',       file: '段永平_励志海报.jpg',     download: '段永平说你一定行.jpg' },
        { name: '查理·芒格',     file: '查理·芒格_励志海报.jpg',   download: '查理·芒格说你一定行.jpg' },
        { name: '凯文·凯利',     file: '凯文·凯利_励志海报.jpg',   download: '凯文·凯利说你一定行.jpg' },
        { name: '黄峥',         file: '黄峥_励志海报.jpg',       download: '黄峥说你一定行.jpg' },
        { name: '张一鸣',       file: '张一鸣_励志海报.jpg',     download: '张一鸣说你一定行.jpg' }
    ];

    var imgPath = 'images/';
    var generatedDataUrl = null;

    // Build poster list
    var list = document.getElementById('posterList');
    posters.forEach(function(p) {
        var item = document.createElement('div');
        item.className = 'poster-item';
        item.innerHTML =
            '<div class="poster-img-wrapper">' +
                '<img class="poster-img" src="' + imgPath + p.file + '" alt="' + p.name + ' 励志海报" loading="lazy">' +
            '</div>' +
            '<a class="btn btn-download" href="' + imgPath + p.file + '" download="' + p.download + '">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                '下载海报' +
            '</a>';
        list.appendChild(item);
    });

    // Toast
    var toastTimer;
    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // Download All
    function downloadAll() {
        var btn = document.getElementById('downloadAllBtn');
        var origHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '打包中...';
        if (typeof JSZip === 'undefined') {
            showToast('JSZip 加载失败，请逐个下载');
            btn.disabled = false; btn.innerHTML = origHTML; return;
        }
        var zip = new JSZip();
        var folder = zip.folder('励志海报');
        var total = posters.length;
        var fetches = posters.map(function(p, i) {
            btn.innerHTML = '打包中 (' + (i+1) + '/' + total + ')...';
            return fetch(imgPath + p.file).then(function(r){return r.blob();}).then(function(b){folder.file(p.download,b);});
        });
        Promise.all(fetches).then(function(){
            btn.innerHTML = '生成 ZIP...';
            return zip.generateAsync({type:'blob'});
        }).then(function(zb){
            var u = URL.createObjectURL(zb);
            var a = document.createElement('a'); a.href = u; a.download = '励志海报_全部.zip';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function(){URL.revokeObjectURL(u);},1000);
            showToast('ZIP 下载完成');
        }).catch(function(e){
            console.error(e); showToast('打包失败，请逐个下载');
        }).finally(function(){
            btn.disabled = false; btn.innerHTML = origHTML;
        });
    }

    // WeChat Share
    function wechatShare() {
        var url = window.location.href;
        if (navigator.share) {
            navigator.share({title:'致梦想改变世界的人 - 励志海报',text:'乔布斯、段永平、查理·芒格、凯文·凯利、黄峥、张一鸣，励志海报免费下载。',url:url})
                .catch(function(err){if(err.name!=='AbortError')copyLink(url);});
        } else { copyLink(url); }
    }
    function copyLink(url) {
        if (navigator.clipboard&&navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function(){showToast('链接已复制，请打开微信粘贴分享');}).catch(function(){fallbackCopy(url);});
        } else { fallbackCopy(url); }
    }
    function fallbackCopy(t){
        var ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{document.execCommand('copy');showToast('链接已复制，请打开微信粘贴分享');}catch(e){showToast('复制失败，请手动复制链接');}
        document.body.removeChild(ta);
    }

    // Back to Top
    var backToTop = document.getElementById('backToTop');
    var ticking = false;
    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(function() {
                if (window.scrollY > 400) backToTop.classList.add('visible');
                else backToTop.classList.remove('visible');
                ticking = false;
            });
            ticking = true;
        }

    // ============ POSTER GENERATOR ============
    var uploadArea = document.getElementById('uploadArea');
    var uploadPreview = document.getElementById('uploadPreview');
    var uploadPlaceholder = document.getElementById('uploadPlaceholder');
    var photoInput = document.getElementById('photoInput');
    var generatedDataUrl = null;

    uploadArea.addEventListener('click', function() { photoInput.click(); });

    photoInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
                uploadPreview.src = ev.target.result;
                uploadPreview.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                uploadArea.classList.add('has-image');
                uploadedImage = img;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    var uploadedImage = null;

    function generatePoster() {
        if (!uploadedImage) { showToast('请先上传人物图片'); return; }

        var nameVal = document.getElementById('nameInput').value.trim();
        if (!nameVal) { showToast('请输入人物姓名'); return; }

        var quote1 = document.getElementById('quote1Input').value.trim();
        if (!quote1) { showToast('请至少输入第一句语录'); return; }

        var birth = document.getElementById('birthInput').value.trim();
        var death = document.getElementById('deathInput').value.trim();
        var quote2 = document.getElementById('quote2Input').value.trim();
        var quote3 = document.getElementById('quote3Input').value.trim();
        var styleVal = document.getElementById('styleInput').value.trim() || '经典励志';

        // Collect quotes
        var quotes = [quote1];
        if (quote2) quotes.push(quote2);
        if (quote3) quotes.push(quote3);

        // Build lifespan string
        var lifespan = '';
        if (birth && death) lifespan = birth + ' - ' + death;
        else if (birth) lifespan = birth + ' - ';

        // Progress
        var progressEl = document.getElementById('generateProgress');
        progressEl.style.display = 'block';
        progressEl.innerHTML = '<span class="spinner"></span>正在生成海报...';
        var btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerHTML = '生成中...';

        // Use setTimeout to let the UI update before heavy canvas work
        setTimeout(function() {
            try {
                renderPoster(nameVal, lifespan, quotes, styleVal);
                progressEl.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '生成海报';
                document.getElementById('canvasPreview').style.display = 'block';
                document.getElementById('canvasPreview').scrollIntoView({behavior:'smooth', block:'center'});
            } catch(e) {
                progressEl.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '生成海报';
                console.error(e);
                showToast('生成失败，请重试');
            }
        }, 100);
    }

    function renderPoster(nameVal, lifespan, quotes, styleVal) {
        var canvas = document.getElementById('posterCanvas');
        var ctx = canvas.getContext('2d');
        var W = 800, H = 1132; // A3-ish ratio

        canvas.width = W;
        canvas.height = H;

        // Dark background with subtle vignette
        var bgGrad = ctx.createRadialGradient(W/2, H*0.4, 100, W/2, H*0.4, W*0.8);
        bgGrad.addColorStop(0, '#2d2d3f');
        bgGrad.addColorStop(1, '#0d0d18');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Subtle texture lines
        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
        ctx.lineWidth = 1;
        for (var y = 0; y < H; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Draw photo - top portion
        var imgW = uploadedImage.width;
        var imgH = uploadedImage.height;
        var targetW = W * 0.72;
        var targetH = H * 0.42;
        var scale = Math.min(targetW / imgW, targetH / imgH);
        var dw = imgW * scale, dh = imgH * scale;
        var dx = (W - dw) / 2, dy = 50;

        // Photo with slight border
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 50;
        ctx.shadowOffsetY = 25;
        ctx.fillStyle = '#333';
        ctx.fillRect(dx - 4, dy - 4, dw + 8, dh + 8);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // Border
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.strokeRect(dx - 4, dy - 4, dw + 8, dh + 8);

        ctx.drawImage(uploadedImage, dx, dy, dw, dh);

        // Name and lifespan - below photo
        var nameY = dy + dh + 60;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 44px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(nameVal, W/2, nameY);

        if (lifespan) {
            ctx.font = '20px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.fillText(lifespan, W/2, nameY + 32);
        }

        // Decorative divider
        var dividerY = lifespan ? nameY + 55 : nameY + 35;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(W/2 - 80, dividerY);
        ctx.lineTo(W/2 + 80, dividerY);
        ctx.stroke();

        // Small diamond at center of divider
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(W/2, dividerY - 4);
        ctx.lineTo(W/2 + 4, dividerY);
        ctx.lineTo(W/2, dividerY + 4);
        ctx.lineTo(W/2 - 4, dividerY);
        ctx.fill();

        // Quotes
        var quoteStartY = dividerY + 45;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';

        quotes.forEach(function(q, qi) {
            var fontSize = quotes.length === 1 ? 32 : (quotes.length === 2 ? 28 : 24);
            ctx.font = 'normal ' + fontSize + 'px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", serif';
            ctx.fillStyle = '#ffffff';

            // Word wrap for each quote
            var words = q.split('');
            var lines = [];
            var line = '';
            var maxW = W - 120;
            for (var wi = 0; wi < words.length; wi++) {
                var test = line + words[wi];
                if (ctx.measureText(test).width > maxW && line.length > 0) {
                    lines.push(line);
                    line = words[wi];
                } else { line = test; }
            }
            if (line) lines.push(line);

            var lineHeight = fontSize + 8;
            var blockStartY = quoteStartY;
            // Calculate block height to center multiple quotes vertically
            if (qi > 0) {
                // Estimate previous block height
                var prevQ = quotes[qi - 1];
                var prevLines = 1;
                var prevW = '';
                for (var pw = 0; pw < prevQ.length; pw++) {
                    var pt = prevW + prevQ[pw];
                    ctx.font = 'normal ' + (quotes.length === 1 ? 32 : (quotes.length === 2 ? 28 : 24)) + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
                    if (ctx.measureText(pt).width > maxW && prevW.length > 0) { prevLines++; prevW = prevQ[pw]; }
                    else { prevW = pt; }
                }
                quoteStartY += prevLines * (fontSize + 8) + 20;
            }

            ctx.font = 'normal ' + fontSize + 'px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
            lines.forEach(function(l, li) {
                ctx.fillText(l, W/2, quoteStartY + li * lineHeight);
            });

            if (qi < quotes.length - 1) {
                quoteStartY += lines.length * lineHeight + 20;
            }
        });

        // Calculate where quotes end for style tag placement
        var totalQuoteLines = 0;
        quotes.forEach(function(q) {
            var fs = quotes.length === 1 ? 32 : (quotes.length === 2 ? 28 : 24);
            var w = '', lns = 1, mw = W - 120;
            ctx.font = 'normal ' + fs + 'px "PingFang SC", "Microsoft YaHei", sans-serif';
            for (var ci = 0; ci < q.length; ci++) {
                var t = w + q[ci];
                if (ctx.measureText(t).width > mw && w.length > 0) { lns++; w = q[ci]; }
                else { w = t; }
            }
            totalQuoteLines += lns;
        });

        var finalQuoteY = dividerY + 45 + totalQuoteLines * 36 + (quotes.length - 1) * 20;

        // Style tag
        var tagY = Math.max(finalQuoteY + 50, H - 130);
        ctx.font = '15px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillText('风格: ' + styleVal, W/2, tagY);

        // Watermark
        ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillText('pengcongbest.github.io/p', W/2, H - 25);

        // Store
        generatedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    }

    function downloadGenerated() {
        if (!generatedDataUrl) { showToast('请先生成海报'); return; }
        var nameVal = document.getElementById('nameInput').value.trim() || '人物';
        var a = document.createElement('a');
        a.href = generatedDataUrl;
        a.download = nameVal + '说你一定行.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('海报下载中');
    }

    // ============ GALLERY ============
    var GALLERY_KEY = 'poster_gallery_items';

    function getGallery() {
        try { return JSON.parse(localStorage.getItem(GALLERY_KEY)) || []; }
        catch(e) { return []; }
    }

    function saveToGallery() {
        if (!generatedDataUrl) { showToast('请先生成海报'); return; }
        var nameVal = document.getElementById('nameInput').value.trim();
        var quote1 = document.getElementById('quote1Input').value.trim();
        var styleVal = document.getElementById('styleInput').value.trim() || '经典励志';
        var gallery = getGallery();
        gallery.unshift({
            id: Date.now(),
            name: nameVal,
            quote: quote1,
            style: styleVal,
            image: generatedDataUrl,
            time: new Date().toLocaleString('zh-CN')
        });
        if (gallery.length > 50) gallery = gallery.slice(0, 50);
        try {
            localStorage.setItem(GALLERY_KEY, JSON.stringify(gallery));
            showToast('已发布到画廊！');
        } catch(e) {
            showToast('图片太大，请下载后手动分享');
        }
    }

    function openGallery() {
        var gallery = getGallery();
        var grid = document.getElementById('galleryGrid');
        var empty = document.getElementById('galleryEmpty');
        grid.innerHTML = '';
        if (gallery.length === 0) {
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            gallery.forEach(function(item) {
                var div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML =
                    '<img src="' + item.image + '" alt="' + escapeHTML(item.name || '') + ' 海报" loading="lazy">' +
                    '<div class="info"><strong>' + escapeHTML(item.name || '') + '</strong><br>' +
                    escapeHTML(item.quote.substring(0,30)) + '<br>' +
                    item.style + ' · ' + item.time + '</div>';
                grid.appendChild(div);
            });
        }
        document.getElementById('galleryModal').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeGallery() {
        document.getElementById('galleryModal').classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('galleryModal').addEventListener('click', function(e) {
        if (e.target === this) closeGallery();
    });

    function escapeHTML(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // Hook up buttons
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAll);
    document.getElementById('wechatShareBtn').addEventListener('click', wechatShare);
    document.getElementById('galleryBtn').addEventListener('click', openGallery);
    document.getElementById('generateBtn').addEventListener('click', generatePoster);
    document.getElementById('downloadGeneratedBtn').addEventListener('click', downloadGenerated);
    document.getElementById('saveToGalleryBtn').addEventListener('click', saveToGallery);
    document.getElementById('modalCloseBtn').addEventListener('click', closeGallery);

    })();
    </script>
