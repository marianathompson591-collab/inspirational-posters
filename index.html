    <style>
        :root {
            --bg: #f5f5f7; --bg-card: #ffffff; --text: #1d1d1f;
            --text-secondary: #86868b; --text-tertiary: #6e6e73;
            --accent: #0071e3; --accent-hover: #0077ed;
            --wechat: #07C160; --wechat-hover: #06AD56;
            --gallery: #ff6b35; --gallery-hover: #e55a2b;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.12);
            --border: rgba(0,0,0,0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1d1f; --bg-card: #2d2d2f; --text: #f5f5f7;
                --text-secondary: #a1a1a6; --text-tertiary: #86868b;
                --accent: #2997ff; --accent-hover: #40a9ff;
                --shadow: 0 4px 20px rgba(0,0,0,0.3);
                --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
                --border: rgba(255,255,255,0.08);
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            line-height: 1.8; transition: background-color 0.3s, color 0.3s;
        }
        .container { max-width:900px; margin:0 auto; padding:40px 20px; }

        .header { text-align:center; margin-bottom:50px; }
        .header h1 { font-size:40px; font-weight:700; margin-bottom:28px; letter-spacing:2px; }
        .header .manifesto { font-size:17px; color:var(--text-secondary); max-width:680px; margin:0 auto; white-space:pre-line; line-height:2; }

        .poster-list { display:flex; flex-direction:column; gap:50px; }
        .poster-item { display:flex; flex-direction:column; align-items:center; gap:16px; }
        .poster-img-wrapper {
            width:100%; max-width:800px; border-radius:16px; overflow:hidden;
            box-shadow:var(--shadow); background:var(--bg-card); transition:box-shadow 0.3s;
        }
        .poster-img-wrapper:hover { box-shadow:var(--shadow-hover); }
        .poster-img { width:100%; display:block; transition:transform 0.3s; }
        .poster-img-wrapper:hover .poster-img { transform:scale(1.02); }

        .btn {
            display:inline-flex; align-items:center; gap:6px;
            border:none; cursor:pointer; text-decoration:none;
            border-radius:980px; padding:12px 24px; font-size:16px; font-weight:500;
            font-family:inherit; transition:background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .btn:active { transform:scale(0.97); }
        .btn:disabled { opacity:0.6; cursor:not-allowed; pointer-events:none; }
        .btn-download {
            background-color:var(--bg-card); color:var(--accent);
            border:1.5px solid var(--border); font-size:15px; padding:10px 20px;
        }
        .btn-download:hover { border-color:var(--accent); background-color:var(--accent); color:#fff; }

        .action-bar {
            display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
            margin-top:60px; margin-bottom:40px;
        }
        .btn-primary { background-color:var(--accent); color:#fff; }
        .btn-primary:hover { background-color:var(--accent-hover); box-shadow:0 4px 16px rgba(0,113,227,0.3); }
        .btn-wechat { background-color:var(--wechat); color:#fff; }
        .btn-wechat:hover { background-color:var(--wechat-hover); box-shadow:0 4px 16px rgba(7,193,96,0.3); }
        .btn-gallery { background-color:var(--gallery); color:#fff; }
        .btn-gallery:hover { background-color:var(--gallery-hover); box-shadow:0 4px 16px rgba(255,107,53,0.3); }

        /* ---------- Poster Generator ---------- */
        .generator-section {
            margin-top:60px; margin-bottom:40px;
            background:var(--bg-card); border-radius:20px;
            padding:40px 32px; box-shadow:var(--shadow);
        }
        .generator-section h2 {
            text-align:center; font-size:24px; font-weight:700;
            margin-bottom:8px; color:var(--text);
        }
        .generator-section .subtitle {
            text-align:center; font-size:15px; color:var(--text-secondary); margin-bottom:32px;

        .generator-form { display:flex; flex-direction:column; gap:20px; max-width:500px; margin:0 auto; }

        .upload-placeholder { color:var(--text-tertiary); font-size:15px; }

        .generator-form input[type="text"],
        .generator-form textarea {
            width:100%; padding:12px 16px; border-radius:10px;
            border:1.5px solid var(--border); background:var(--bg);
            color:var(--text); font-size:16px; font-family:inherit;
            transition:border-color 0.2s; outline:none;

        .generator-form input[type="text"]:focus,
        .generator-form textarea:focus { border-color:var(--accent); }
        .generator-form textarea { min-height:80px; resize:vertical; }

        .canvas-preview { text-align:center; margin-top:24px; display:none; }
        .canvas-preview canvas { max-width:100%; border-radius:12px; box-shadow:var(--shadow); }
        .canvas-preview .preview-actions { margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .generate-progress { margin-top:12px; }
        .generate-progress .spinner {
            display:inline-block; width:18px; height:18px;
            border:2px solid var(--border); border-top-color:var(--accent);
            border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* ---------- Gallery Modal ---------- */
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); z-index:3000;
            display:flex; align-items:center; justify-content:center;
            opacity:0; pointer-events:none; transition:opacity 0.3s;

        .modal-overlay.open { opacity:1; pointer-events:auto; }
        .modal {

            overflow-y:auto; padding:32px; position:relative;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);

        .modal-close {

            font-size:18px; display:flex; align-items:center; justify-content:center;
            color:var(--text-secondary); transition:background 0.2s;
        }
        .modal-close:hover { background:var(--text-tertiary); color:#fff; }
        .modal h2 { text-align:center; font-size:22px; margin-bottom:24px; }
        .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
        .gallery-item { border-radius:12px; overflow:hidden; box-shadow:var(--shadow); background:var(--bg); }
        .gallery-item img { width:100%; display:block; }
        .gallery-item .info { padding:10px 12px; font-size:13px; color:var(--text-secondary); }
        .gallery-item .info strong { color:var(--text); }
        .gallery-empty { text-align:center; color:var(--text-tertiary); padding:40px; }

        footer { text-align:center; padding:20px; color:var(--text-tertiary); font-size:14px; }
        footer .signature { font-size:15px; color:var(--text-secondary); }

        .back-to-top {
            position:fixed; bottom:30px; right:30px; width:44px; height:44px;
            border-radius:50%; background-color:var(--bg-card); border:1px solid var(--border);
            box-shadow:var(--shadow); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            color:var(--text-secondary); opacity:0; pointer-events:none;
            transition:opacity 0.3s, transform 0.2s; z-index:1000;
        }
        .back-to-top.visible { opacity:1; pointer-events:auto; }
        .back-to-top:hover { transform:translateY(-2px); color:var(--accent); }

        .toast {
            position:fixed; bottom:40px; left:50%;
            transform:translateX(-50%) translateY(100px);
            background:#1d1d1f; color:#fff; padding:12px 24px;
            border-radius:980px; font-size:15px; z-index:4000;
            pointer-events:none;
            transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .toast.show { transform:translateX(-50%) translateY(0); }
        @media (prefers-color-scheme:dark) { .toast { background:#f5f5f7; color:#1d1d1f; } }

        @media (max-width:768px) {
            .header h1 { font-size:28px; letter-spacing:1px; }
            .header .manifesto { font-size:15px; line-height:1.9; }
            .poster-list { gap:36px; }
            .poster-item { gap:12px; }
            .action-bar { margin-top:40px; }
            .generator-section { padding:24px 16px; }
            .back-to-top { bottom:20px; right:16px; width:40px; height:40px; }
            .btn { padding:10px 20px; font-size:15px; }
            .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <script>
    (function() {

    var posters = [
        { name: '史蒂夫·乔布斯', file: '史蒂夫·乔布斯_励志海报.jpg', download: '史蒂夫·乔布斯说你一定行.jpg' },
        { name: '段永平',       file: '段永平_励志海报.jpg',     download: '段永平说你一定行.jpg' },
        { name: '查理·芒格',     file: '查理·芒格_励志海报.jpg',   download: '查理·芒格说你一定行.jpg' },
        { name: '凯文·凯利',     file: '凯文·凯利_励志海报.jpg',   download: '凯文·凯利说你一定行.jpg' },
        { name: '黄峥',         file: '黄峥_励志海报.jpg',       download: '黄峥说你一定行.jpg' },
        { name: '张一鸣',       file: '张一鸣_励志海报.jpg',     download: '张一鸣说你一定行.jpg' }
    ];

    var imgPath = 'images/';
    var generatedDataUrl = null;

    // Build poster list
    var list = document.getElementById('posterList');
    posters.forEach(function(p) {
        var item = document.createElement('div');
        item.className = 'poster-item';
        item.innerHTML =
            '<div class="poster-img-wrapper">' +
                '<img class="poster-img" src="' + imgPath + p.file + '" alt="' + p.name + ' 励志海报" loading="lazy">' +
            '</div>' +
            '<a class="btn btn-download" href="' + imgPath + p.file + '" download="' + p.download + '">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                '下载海报' +
            '</a>';
        list.appendChild(item);
    });

    // Toast
    var toastTimer;
    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // Download All
    function downloadAll() {
        var btn = document.getElementById('downloadAllBtn');
        var origHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '打包中...';
        if (typeof JSZip === 'undefined') {
            showToast('JSZip 加载失败，请逐个下载');
            btn.disabled = false; btn.innerHTML = origHTML; return;
        }
        var zip = new JSZip();
        var folder = zip.folder('励志海报');
        var total = posters.length;
        var fetches = posters.map(function(p, i) {
            btn.innerHTML = '打包中 (' + (i+1) + '/' + total + ')...';
            return fetch(imgPath + p.file).then(function(r){return r.blob();}).then(function(b){folder.file(p.download,b);});
        });
        Promise.all(fetches).then(function(){
            btn.innerHTML = '生成 ZIP...';
            return zip.generateAsync({type:'blob'});
        }).then(function(zb){
            var u = URL.createObjectURL(zb);
            var a = document.createElement('a'); a.href = u; a.download = '励志海报_全部.zip';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function(){URL.revokeObjectURL(u);},1000);
            showToast('ZIP 下载完成');
        }).catch(function(e){
            console.error(e); showToast('打包失败，请逐个下载');
        }).finally(function(){
            btn.disabled = false; btn.innerHTML = origHTML;
        });
    }

    // WeChat Share
    function wechatShare() {
        var url = window.location.href;
        if (navigator.share) {
            navigator.share({title:'致梦想改变世界的人 - 励志海报',text:'乔布斯、段永平、查理·芒格、凯文·凯利、黄峥、张一鸣，励志海报免费下载。',url:url})
                .catch(function(err){if(err.name!=='AbortError')copyLink(url);});
        } else { copyLink(url); }
    }
    function copyLink(url) {
        if (navigator.clipboard&&navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function(){showToast('链接已复制，请打开微信粘贴分享');}).catch(function(){fallbackCopy(url);});
        } else { fallbackCopy(url); }
    }
    function fallbackCopy(t){
        var ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{document.execCommand('copy');showToast('链接已复制，请打开微信粘贴分享');}catch(e){showToast('复制失败，请手动复制链接');}
        document.body.removeChild(ta);
    }

    // Back to Top
    var backToTop = document.getElementById('backToTop');
    var ticking = false;
    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(function() {
                if (window.scrollY > 400) backToTop.classList.add('visible');
                else backToTop.classList.remove('visible');
                ticking = false;
            });
            ticking = true;
        }
    });
    backToTop.addEventListener('click', function() { window.scrollTo({top:0,behavior:'smooth'}); });

    // ============ POSTER GENERATOR ============
    var uploadArea = document.getElementById('uploadArea');
    var uploadPreview = document.getElementById('uploadPreview');
    var uploadPlaceholder = document.getElementById('uploadPlaceholder');
    var photoInput = document.getElementById('photoInput');

    uploadArea.addEventListener('click', function() { photoInput.click(); });

    photoInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
                uploadPreview.src = ev.target.result;
                uploadPreview.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                uploadArea.classList.add('has-image');
                uploadedImage = img;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    var uploadedImage = null;

    function generatePoster() {
        if (!uploadedImage) { showToast('请先上传人物图片'); return; }
        var nameVal = document.getElementById('nameInput').value.trim();
        if (!nameVal) { showToast('请输入人物姓名'); return; }
        var quote1 = document.getElementById('quote1Input').value.trim();
        if (!quote1) { showToast('请至少输入第一句语录'); return; }
        var lifespan = document.getElementById('birthInput').value.trim();
        var quote2 = document.getElementById('quote2Input').value.trim();
        var quote3 = document.getElementById('quote3Input').value.trim();
        var styleVal = document.getElementById('styleInput').value.trim() || '经典励志';
        var quotes = [quote1];
        if (quote2) quotes.push(quote2);
        if (quote3) quotes.push(quote3);

        var progressEl = document.getElementById('generateProgress');
        progressEl.style.display = 'block';
        progressEl.innerHTML = '<span class="spinner"></span>正在生成海报...';
        var btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerHTML = '生成中...';

        setTimeout(function() {
            try {
                renderPoster(nameVal, lifespan, quotes, styleVal);
                progressEl.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '生成海报';
                document.getElementById('canvasPreview').style.display = 'block';
                document.getElementById('canvasPreview').scrollIntoView({behavior:'smooth', block:'center'});
                autoSaveToGallery(nameVal, quote1, styleVal);
            } catch(e) {
                progressEl.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '生成海报';
                console.error(e);
                showToast('生成失败，请重试');
            }
        }, 100);
    }

    function extractColors(img) {
        var cv = document.createElement('canvas'); var cx = cv.getContext('2d');
        var sw = Math.min(img.width, 100); var sh = Math.round(img.height*(sw/img.width));
        cv.width=sw; cv.height=sh; cx.drawImage(img,0,0,sw,sh);
        var p = cx.getImageData(0,0,sw,sh).data; var r=0,g=0,b=0,n=0;
        for (var i=0;i<p.length;i+=16){r+=p[i];g+=p[i+1];b+=p[i+2];n++;}
        r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);
        return {
            avg:'rgb('+r+','+g+','+b+')',
            dark:'rgb('+Math.round(r*0.35)+','+Math.round(g*0.35)+','+Math.round(b*0.35)+')',
            darker:'rgb('+Math.round(r*0.18)+','+Math.round(g*0.18)+','+Math.round(b*0.18)+')'
        };
    }

    function renderPoster(nameVal, lifespan, quotes, styleVal) {
        var canvas = document.getElementById('posterCanvas');
        var ctx = canvas.getContext('2d');
        var colors = extractColors(uploadedImage);
        var W=800, H=1132; canvas.width=W; canvas.height=H;

        // Dark background from photo colors
        var bg=ctx.createLinearGradient(0,0,0,H);
        bg.addColorStop(0,colors.darker); bg.addColorStop(0.4,colors.dark); bg.addColorStop(1,colors.darker);
        ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

        // Film grain
        var id=ctx.getImageData(0,0,W,H); var pd=id.data;
        for (var i=0;i<pd.length;i+=4){var nz=(Math.random()-0.5)*16;pd[i]=Math.min(255,Math.max(0,pd[i]+nz));pd[i+1]=Math.min(255,Math.max(0,pd[i+1]+nz));pd[i+2]=Math.min(255,Math.max(0,pd[i+2]+nz));}
        ctx.putImageData(id,0,0);

        // Subtle geometric circles
        ctx.fillStyle='rgba(255,255,255,0.025)'; ctx.beginPath(); ctx.arc(W*0.85,H*0.18,W*0.5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.018)'; ctx.beginPath(); ctx.arc(W*0.15,H*0.72,W*0.32,0,Math.PI*2); ctx.fill();

        // Cinematic photo crop
        var ir=uploadedImage.width/uploadedImage.height;
        var tw,th; if(ir>1){tw=W*0.78;th=tw/ir;}else{th=H*0.48;tw=th*ir;}
        var dx=(W-tw)/2, dy=55;

        ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=60; ctx.shadowOffsetY=30;
        ctx.fillStyle='#222'; ctx.fillRect(dx-3,dy-3,tw+6,th+6);
        ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
        ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=2; ctx.strokeRect(dx-3,dy-3,tw+6,th+6);
        ctx.drawImage(uploadedImage,dx,dy,tw,th);

        // Gradient overlay at photo bottom
        var ov=ctx.createLinearGradient(0,dy+th*0.7,0,dy+th);
        ov.addColorStop(0,'rgba(0,0,0,0)'); ov.addColorStop(1,colors.darker);
        ctx.fillStyle=ov; ctx.fillRect(dx,dy+th*0.7,tw,th*0.3);

        // Name
        var nameY=dy+th+65; ctx.fillStyle='#ffffff'; ctx.textAlign='center';
        ctx.font='bold 48px "PingFang SC","Noto Serif SC","SimSun","Microsoft YaHei",serif';
        ctx.fillText(nameVal,W/2,nameY);

        // Lifespan
        if(lifespan){ctx.font='italic 22px "Georgia","PingFang SC","Noto Serif SC",serif';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText(lifespan,W/2,nameY+35);}

        // Double-line divider with diamond
        var dvY=lifespan?nameY+55:nameY+35;
        ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(W/2-90,dvY);ctx.lineTo(W/2+90,dvY);ctx.stroke();
        ctx.beginPath();ctx.moveTo(W/2-55,dvY+5);ctx.lineTo(W/2+55,dvY+5);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.4)';
        ctx.beginPath();ctx.moveTo(W/2,dvY-4);ctx.lineTo(W/2+4,dvY+2.5);ctx.lineTo(W/2,dvY+9);ctx.lineTo(W/2-4,dvY+2.5);ctx.fill();

        // Quotes with proper Chinese typography
        var qsY=dvY+40;
        quotes.forEach(function(q,qi){
            var fs=quotes.length===1?30:(quotes.length===2?26:22);
            ctx.font='normal '+fs+'px "PingFang SC","Noto Serif SC","STSong","Microsoft YaHei",serif';
            ctx.fillStyle='rgba(255,255,255,0.9)';
            var mw=W-140,ls=[],cl='';
            for(var wi=0;wi<q.length;wi++){var tl=cl+q[wi];if(ctx.measureText(tl).width>mw&&cl.length>0){ls.push(cl);cl=q[wi];}else{cl=tl;}}
            if(cl)ls.push(cl); var lh=fs+12;
            ls.forEach(function(l,li){ctx.fillText(l,W/2,qsY+li*lh);});
            if(qi<quotes.length-1)qsY+=ls.length*lh+14;
        });

        // Style pill at bottom
        var tql=0; quotes.forEach(function(q){
            var fs=quotes.length===1?30:(quotes.length===2?26:22);
            ctx.font='normal '+fs+'px "PingFang SC",serif';var l='',ln=1;
            for(var ci=0;ci<q.length;ci++){var t2=l+q[ci];if(ctx.measureText(t2).width>W-140&&l.length>0){ln++;l=q[ci];}else{l=t2;}}tql+=ln;
        });
        var fy=dvY+40+tql*38+(quotes.length-1)*14+50;
        var pw=ctx.measureText('· '+styleVal+' ·').width+40, px2=W/2-pw/2;
        ctx.fillStyle='rgba(255,255,255,0.07)';
        ctx.beginPath();ctx.moveTo(px2+20,fy);ctx.lineTo(px2+pw-20,fy);
        ctx.quadraticCurveTo(px2+pw,fy,px2+pw,fy+20);ctx.lineTo(px2+pw,fy+20);
        ctx.quadraticCurveTo(px2+pw,fy+20,px2+pw-20,fy+20);ctx.lineTo(px2+20,fy+20);
        ctx.quadraticCurveTo(px2,fy+20,px2,fy);ctx.lineTo(px2,fy);
        ctx.quadraticCurveTo(px2,fy,px2+20,fy);ctx.fill();
        ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.fillText('· '+styleVal+' ·',W/2,fy+5);

        generatedDataUrl = canvas.toDataURL('image/jpeg', 0.93);
    }

    function downloadGenerated() {
        if (!generatedDataUrl) { showToast('请先生成海报'); return; }
        var nameVal = document.getElementById('nameInput').value.trim() || '人物';
        var a = document.createElement('a');
        a.href = generatedDataUrl;
        a.download = nameVal + '说你一定行.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('海报下载中');
    }

    // ============ WIKIDATA LOOKUP ============
    function lookupPerson() {
        var nameVal = document.getElementById('nameInput').value.trim();
        if (!nameVal) { showToast('请先输入人物姓名'); return; }
        var status = document.getElementById('lookupStatus');
        var btn = document.getElementById('lookupBtn');
        status.style.display='block'; status.textContent='搜索中...'; btn.disabled=true;
        var url='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(nameVal)+'&language=zh&format=json&origin=*';
        fetch(url).then(function(r){return r.json();}).then(function(data){
            if(data.search&&data.search.length>0){
                var desc=data.search[0].description||'';
                var m=desc.match(/\((\d{4})[–\-—](\d{4}|至今|present)/)||desc.match(/(\d{4})[年\s]*[–\-—]\s*(\d{4}|至今)/);
                if(m){document.getElementById('birthInput').value=m[1]+'-'+m[2];status.textContent='已找到生卒年份: '+m[1]+'-'+m[2];}
                else{var by=desc.match(/(\d{4})/);if(by){document.getElementById('birthInput').value=by[1]+'-';status.textContent='找到出生年份: '+by[1];}else{status.textContent='未找到生卒信息，请手动填写';}}
            }else{status.textContent='未找到人物信息，请手动填写';}
        }).catch(function(e){status.textContent='搜索失败（网络问题），请手动填写';}).finally(function(){btn.disabled=false;});
    }

    // ============ GALLERY (auto-save) ============
    var GALLERY_KEY = 'poster_gallery_items';

    function autoSaveToGallery(nameVal, quote1, styleVal) {
        if (!generatedDataUrl) return;
        var gallery = getGallery();
        gallery.unshift({id:Date.now(),name:nameVal,quote:quote1,style:styleVal,image:generatedDataUrl,time:new Date().toLocaleString('zh-CN')});
        if(gallery.length>50)gallery=gallery.slice(0,50);
        try{localStorage.setItem(GALLERY_KEY,JSON.stringify(gallery));}catch(e){}
    }

    function getGallery() {
        try{return JSON.parse(localStorage.getItem(GALLERY_KEY))||[];}catch(e){return[];}
    }

    function openGallery() {
        var gallery=getGallery();var grid=document.getElementById('galleryGrid');var empty=document.getElementById('galleryEmpty');
        grid.innerHTML='';
        if(gallery.length===0){empty.style.display='block';}else{empty.style.display='none';
            gallery.forEach(function(item){
                var div=document.createElement('div');div.className='gallery-item';
                div.innerHTML='<img src="'+item.image+'" alt="'+escapeHTML(item.name||'')+' 海报" loading="lazy"><div class="info"><strong>'+escapeHTML(item.name||'')+'</strong><br>'+escapeHTML(item.quote.substring(0,30))+'<br>'+(item.style||'')+' · '+item.time+'</div>';
                grid.appendChild(div);
            });
        }
        document.getElementById('galleryModal').classList.add('open');document.body.style.overflow='hidden';
    }

    function closeGallery() {document.getElementById('galleryModal').classList.remove('open');document.body.style.overflow='';}
    document.getElementById('galleryModal').addEventListener('click',function(e){if(e.target===this)closeGallery();});

    function escapeHTML(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

    // Hook up
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAll);
    document.getElementById('wechatShareBtn').addEventListener('click', wechatShare);
    document.getElementById('galleryBtn').addEventListener('click', openGallery);
    document.getElementById('generateBtn').addEventListener('click', generatePoster);
    document.getElementById('downloadGeneratedBtn').addEventListener('click', downloadGenerated);
    document.getElementById('lookupBtn').addEventListener('click', lookupPerson);
    document.getElementById('modalCloseBtn').addEventListener('click', closeGallery);

    })();
    </script>
