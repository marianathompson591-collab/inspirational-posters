    <style>
        :root {
            --bg: #f5f5f7;
            --bg-card: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #6e6e73;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --wechat: #07C160;
            --wechat-hover: #06AD56;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 40px rgba(0, 0, 0, 0.12);
            --border: rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1d1f;
                --bg-card: #2d2d2f;
                --text: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #86868b;
                --accent: #2997ff;
                --accent-hover: #40a9ff;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 8px 40px rgba(0, 0, 0, 0.5);
                --border: rgba(255, 255, 255, 0.08);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: 40px; font-weight: 700; margin-bottom: 28px; color: var(--text); letter-spacing: 2px; }
        .header .manifesto { font-size: 17px; color: var(--text-secondary); max-width: 680px; margin: 0 auto; white-space: pre-line; line-height: 2; }

        .poster-list { display: flex; flex-direction: column; gap: 50px; }
        .poster-item { display: flex; flex-direction: column; align-items: center; gap: 16px; }

        .poster-img-wrapper {
            width: 100%; max-width: 800px; border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow); background: var(--bg-card); transition: box-shadow 0.3s;
        }
        .poster-img-wrapper:hover { box-shadow: var(--shadow-hover); }
        .poster-img { width: 100%; display: block; transition: transform 0.3s; }
        .poster-img-wrapper:hover .poster-img { transform: scale(1.02); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: none; cursor: pointer; text-decoration: none;
            border-radius: 980px; padding: 12px 24px; font-size: 16px; font-weight: 500;
            font-family: inherit; transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

        .btn-download {
            background-color: var(--bg-card); color: var(--accent);
            border: 1.5px solid var(--border); font-size: 15px; padding: 10px 20px;
        }
        .btn-download:hover { border-color: var(--accent); background-color: var(--accent); color: #fff; }

        .action-bar {
            display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
            margin-top: 60px; margin-bottom: 40px;
        }
        .btn-primary { background-color: var(--accent); color: #fff; }
        .btn-primary:hover { background-color: var(--accent-hover); box-shadow: 0 4px 16px rgba(0, 113, 227, 0.3); }
        .btn-wechat { background-color: var(--wechat); color: #fff; }
        .btn-wechat:hover { background-color: var(--wechat-hover); box-shadow: 0 4px 16px rgba(7, 193, 96, 0.3); }

        footer { text-align: center; padding: 20px; color: var(--text-tertiary); font-size: 14px; }
        footer .signature { font-size: 15px; color: var(--text-secondary); }

        .back-to-top {
            position: fixed; bottom: 30px; right: 30px; width: 44px; height: 44px;
            border-radius: 50%; background-color: var(--bg-card); border: 1px solid var(--border);
            box-shadow: var(--shadow); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.2s; z-index: 1000;
        }
        .back-to-top.visible { opacity: 1; pointer-events: auto; }
        .back-to-top:hover { transform: translateY(-2px); color: var(--accent); }

        .toast {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1d1d1f; color: #fff; padding: 12px 24px;
            border-radius: 980px; font-size: 15px; z-index: 2000;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @media (prefers-color-scheme: dark) { .toast { background: #f5f5f7; color: #1d1d1f; } }

        @media (max-width: 768px) {
            .header h1 { font-size: 28px; letter-spacing: 1px; }
            .header .manifesto { font-size: 15px; line-height: 1.9; }
            .poster-list { gap: 36px; }
            .poster-item { gap: 12px; }
            .action-bar { margin-top: 40px; }
            .back-to-top { bottom: 20px; right: 16px; width: 40px; height: 40px; }
            .btn { padding: 10px 20px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>致梦想改变世界的人</h1>
            <p class="manifesto">生命转瞬即逝，没时间在乎他人的想法。
哪怕多活一天，也可以创造精彩的旅程。
如果你觉得想改变世界的人都是疯子，
看看身边，一切的一切，
都是由凡人设计和制造的。
做出点东西，有多难呢？
制作这个网站的人，
不会写代码、不会用PS、不懂AI。
他现在是nobody，
但他希望做出点好东西向父母和世界表达感谢。</p>
        </div>

        <div class="poster-list" id="posterList"></div>

        <div class="action-bar">
            <button class="btn btn-primary" id="downloadAllBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载全部海报 (ZIP)
            </button>
            <button class="btn btn-wechat" id="wechatShareBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zM13.5 10.602c-2.596 0-4.688 2.09-4.688 4.652 0 2.562 2.092 4.653 4.688 4.653.466 0 .926-.068 1.362-.196l1.276.744a.224.224 0 00.112.036.197.197 0 00.194-.197c0-.048-.012-.095-.032-.142l-.263-.992a.392.392 0 01.143-.442C18.154 17.508 19.2 15.991 19.2 15.254c0-2.562-2.092-4.652-4.688-4.652h-.012.012zm-2.344 2.326a.78.78 0 01.781.787.78.78 0 01-.781.785.78.78 0 01-.781-.785c0-.434.347-.787.781-.787zm4.688 0a.78.78 0 01.781.787.78.78 0 01-.781.785.78.78 0 01-.781-.785c0-.434.347-.787.781-.787z"/></svg>
                微信分享
            </button>
        </div>

        <footer>
            <p class="signature">彭聪 2026年5月于中国武汉</p>
        </footer>
    </div>

    <button class="back-to-top" id="backToTop" title="回到顶部">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <script>
    (function() {

    var posters = [
        { name: '史蒂夫·乔布斯', file: '史蒂夫·乔布斯_励志海报.jpg' },
        { name: '段永平',       file: '段永平_励志海报.jpg' },
        { name: '查理·芒格',     file: '查理·芒格_励志海报.jpg' },
        { name: '凯文·凯利',     file: '凯文·凯利_励志海报.jpg' },
        { name: '黄峥',         file: '黄峥_励志海报.jpg' },
        { name: '张一鸣',       file: '张一鸣_励志海报.jpg' }
    ];

    var imgPath = 'images/';

    // Build poster list
    var list = document.getElementById('posterList');
    posters.forEach(function(p) {
        var item = document.createElement('div');
        item.className = 'poster-item';
        item.innerHTML =
            '<div class="poster-img-wrapper">' +
                '<img class="poster-img" src="' + imgPath + p.file + '" alt="' + p.name + ' 励志海报">' +
            '</div>' +
            '<a class="btn btn-download" href="' + imgPath + p.file + '" download="' + p.file + '">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                '下载海报' +
            '</a>';
        list.appendChild(item);
    });

    // Toast
    var toastTimer;
    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // Download All as ZIP
    function downloadAll() {
        var btn = document.getElementById('downloadAllBtn');
        var origHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '打包中...';

        if (typeof JSZip === 'undefined') {
            showToast('JSZip 加载失败，请逐个下载');
            btn.disabled = false;
            btn.innerHTML = origHTML;
            return;
        }

        var zip = new JSZip();
        var folder = zip.folder('励志海报');
        var total = posters.length;

        var fetches = posters.map(function(p, i) {
            btn.innerHTML = '打包中 (' + (i + 1) + '/' + total + ')...';
            return fetch(imgPath + p.file)
                .then(function(r) { return r.blob(); })
                .then(function(blob) { folder.file(p.file, blob); });
        });

        Promise.all(fetches)
            .then(function() {
                btn.innerHTML = '生成 ZIP...';
                return zip.generateAsync({ type: 'blob' });
            })
            .then(function(zipBlob) {
                var url = URL.createObjectURL(zipBlob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '励志海报_全部.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                showToast('ZIP 下载完成');
            })
            .catch(function(e) {
                console.error(e);
                showToast('打包失败，请逐个下载');
            })
            .finally(function() {
                btn.disabled = false;
                btn.innerHTML = origHTML;
            });
    }

    // WeChat Share
    function wechatShare() {
        var url = window.location.href;
        if (navigator.share) {
            navigator.share({
                title: '致梦想改变世界的人 - 励志海报',
                text: '乔布斯、段永平、查理·芒格、凯文·凯利、黄峥、张一鸣，励志海报免费下载。',
                url: url
            }).catch(function(err) {
                if (err.name !== 'AbortError') copyLink(url);
            });
        } else {
            copyLink(url);
        }
    }

    function copyLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function() {
                showToast('链接已复制，请打开微信粘贴分享');
            }).catch(function() {
                fallbackCopy(url);
            });
        } else {
            fallbackCopy(url);
        }
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); showToast('链接已复制，请打开微信粘贴分享'); }
        catch (e) { showToast('复制失败，请手动复制链接'); }
        document.body.removeChild(ta);
    }

    // Back to Top
    var backToTop = document.getElementById('backToTop');
    var ticking = false;
    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(function() {
                if (window.scrollY > 400) backToTop.classList.add('visible');
                else backToTop.classList.remove('visible');
                ticking = false;
            });
            ticking = true;
        }
    });
    backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Hook up
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAll);
    document.getElementById('wechatShareBtn').addEventListener('click', wechatShare);

    })();
    </script>
</body>
